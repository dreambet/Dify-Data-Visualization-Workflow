          : \"生成成功\"\n            }\n    except urllib.error.URLError as e:\n        return {\"download_url\": \"\", \"message\": f\"连接 Flask 服务失败: {str(e)}\"}\n    except Exception as e:\n        return {\"download_url\": \"\", \"message\": f\"解析出错: {str(e)}\"}"
